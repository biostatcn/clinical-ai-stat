# Decap CMS Configuration
# Docs: https://decapcms.org/docs/configure-decap-cms/

backend:
  name: github
  repo: biostatcn/clinical-ai-stat
  branch: master
  # OAuth proxy for GitHub authentication
  # Deploy your own via Vercel (free):
  #   1. Fork https://github.com/vencax/netlify-cms-github-oauth-provider
  #   2. Click "Deploy to Vercel" in that repo
  #   3. Create GitHub OAuth App, set callback to your Vercel URL
  #   4. Set Vercel env vars: CLIENT_ID, CLIENT_SECRET
  #   5. Update base_url below to your Vercel URL
  base_url: https://clinical-ai-stat-3t74juaz9-biostatcns-projects.vercel.app
  auth_endpoint: api/auth

# Publish mode: save as draft, then publish
publish_mode: editorial_workflow

media_folder: "docs/assets/uploads"
public_folder: "/clinical-ai-stat/assets/uploads"

# ============================================================
# Collections
# ============================================================

collections:
  # ---------- 统计方法 ----------
  - name: methods
    label: "统计方法"
    label_singular: "方法"
    folder: docs/methods
    create: true
    delete: true
    path: "{{slug}}"
    preview_path: "methods/{{slug}}"
    fields:
      - label: "标题"
        name: title
        widget: string
      - label: "描述"
        name: description
        widget: text
        required: false
      - label: "内容"
        name: body
        widget: markdown

  # ---------- 可视化图库 ----------
